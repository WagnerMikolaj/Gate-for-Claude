# Dedicated to Gate containers. No published proxy port, never expose to workstations.
# CONNECT passthrough retains end-to-end TLS certificate verification.
http_port 3128
acl CONNECT method CONNECT
acl TLS_ports port 443
acl permitted_hosts dstdomain api.anthropic.com login.microsoftonline.com
http_access deny !CONNECT
http_access deny !TLS_ports
http_access allow permitted_hosts
http_access deny all
cache deny all
access_log none
cache_log /dev/stderr
pid_filename /tmp/squid.pid
shutdown_lifetime 2 seconds
